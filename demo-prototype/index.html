<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>

    <!-- Bootstrap 5 CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
    />

    <style>
        :root{
            --bg-1: #11151C;   /* primary background */
            --bg-2: #212D40;   /* secondary surface */
            --acc-1:#364156;   /* accents/borders */
            --text:#E8EEF2;    /* light text for contrast */
            --muted:#A9B3C1;
        }

        html, body { height: 100%; }
        body {
            background: var(--bg-1);
            color: var(--text);
            line-height: 1.5;
            font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
        }

        /* Left image panel */
        .auth-image {
            background-image:
                    linear-gradient(0deg, rgba(17,21,28,.55), rgba(17,21,28,.55)),
                    url("https://images.unsplash.com/photo-1512295767273-ac109ac3acfa?q=80&w=1600&auto=format&fit=crop"); /* placeholder */
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            border-right: 1px solid var(--acc-1);
        }

        /* Card-like form surface */
        .auth-panel {
            background: var(--bg-2);
            border: 1px solid var(--acc-1);
            border-radius: .75rem;
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
        }

        label { font-weight: 600; }

        .form-control, .form-check-input {
            background-color: #1A2230;
            border: 1px solid var(--acc-1);
            color: var(--text);
        }
        .form-control::placeholder { color: var(--muted); }
        .form-control:focus {
            border-color: #4A5A75;
            box-shadow: 0 0 0 .25rem rgba(54,65,86,.35);
            background-color: #1A2230;
            color: var(--text);
        }

        .btn-primary {
            background-color: #4A5A75;   /* slightly lighter than accents for prominence */
            border-color: #4A5A75;
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: #3F4E68;
            border-color: #3F4E68;
        }

        a, .link-light { color: #C8D3E1; }
        a:hover, a:focus { color: #FFFFFF; }

        /* Small helper text color */
        .form-text { color: var(--muted); }

        /* Make sure the panel doesn’t get too wide on desktops */
        .panel-width { max-width: 420px; width: 100%; }
    </style>
</head>
<body>
<main class="container-fluid">
    <div class="row g-0 min-vh-100">

        <!-- Left image (hidden on small screens) -->
        <aside class="col-md-6 d-none d-md-block auth-image" role="img"
               aria-label="Decorative placeholder image panel for the login page"></aside>

        <!-- Right form column -->
        <section class="col-12 col-md-6 d-flex align-items-center justify-content-center p-4 p-md-5">
            <div class="auth-panel p-4 p-md-5 panel-width">
                <header class="mb-4">
                    <h1 class="h3 mb-1">Login</h1>
                    <p class="mb-0 text-secondary">Welcome back! Please enter your details to continue.</p>
                </header>

                <form action="#" method="post" novalidate>
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="name@example.com"
                                autocomplete="email"
                                required
                                aria-describedby="emailHelp"
                        />
                        <div id="emailHelp" class="form-text">We’ll never share your email.</div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                                minlength="8"
                        />
                    </div>

                    <!-- Options row -->
                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2 mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="1" id="remember" />
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <a class="text-decoration-none" href="#" aria-label="Forgot your password?">Forgot password?</a>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Log in</button>
                    </div>
                </form>
            </div>
        </section>

    </div>
</main>
</body>
</html>
